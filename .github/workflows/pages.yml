# Publishes the static export in docs/ to GitHub Pages.
# The export is generated by `npm run export:static` and committed, so the
# deploy is a plain artifact upload — no build step, no secrets.
name: Pages

on:
  push:
    branches: [arena/e59b6511-lionpost]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Pages for this repository
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
